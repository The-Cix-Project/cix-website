<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<style>.card text{stroke:none}</style>
<title id="title">Cix architecture overview</title>
<desc id="desc">Clients call the Cix API. cixd, a C daemon compiled with TCC, is the single control authority. It applies Linux namespaces, cgroups, OverlayFS, rtnetlink, device grants, and disk roles to containers and the read-only A/B host.</desc>
<defs><style>.bg{fill:#0a0d0f}.card{fill:#11181b;stroke:#45535a;stroke-width:2}.api{fill:#2a1d16;stroke:#d76b35;stroke-width:2}.kernel{fill:#10242a;stroke:#55a9bd;stroke-width:2}.work{fill:#15251f;stroke:#8ecf76;stroke-width:2}.host{fill:#171d20;stroke:#aeb9bd;stroke-width:2}.txt{fill:#f2f0e9;font:600 20px system-ui,sans-serif}.sub{fill:#b6c0c2;font:400 15px system-ui,sans-serif}.label{fill:#d76b35;font:700 13px system-ui,sans-serif;letter-spacing:2px}.legend{fill:#b6c0c2;font:400 14px system-ui,sans-serif}.line{fill:none;stroke-width:3}.la{stroke:#d76b35}.lk{stroke:#55a9bd}.lw{stroke:#8ecf76}.lh{stroke:#aeb9bd}</style><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 10,4 0,8z" fill="#d76b35"/></marker><marker id="k" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 10,4 0,8z" fill="#55a9bd"/></marker><marker id="w" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 10,4 0,8z" fill="#8ecf76"/></marker><marker id="h" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 10,4 0,8z" fill="#aeb9bd"/></marker></defs>
<rect class="bg" width="1200" height="900" rx="12"/><text x="60" y="56" class="label">CIX / READABLE SYSTEM MAP</text><text x="60" y="88" class="sub">Every operator action follows one API path to Linux primitives and managed workloads.</text>
<g class="card"><rect x="60" y="130" width="230" height="86" rx="8"/><text x="82" y="164" class="txt">cixctl</text><text x="82" y="190" class="sub">CLI · HTTP / JSON</text></g><g class="card"><rect x="320" y="130" width="230" height="86" rx="8"/><text x="342" y="164" class="txt">Web dashboard</text><text x="342" y="190" class="sub">vanilla HTML · same API</text></g><g class="card"><rect x="580" y="130" width="230" height="86" rx="8"/><text x="602" y="164" class="txt">Physical console</text><text x="602" y="190" class="sub">local operator surface</text></g><g class="card"><rect x="840" y="130" width="300" height="86" rx="8"/><text x="862" y="164" class="txt">Your tools</text><text x="862" y="190" class="sub">OpenAPI · WebSocket integrations</text></g>
<path d="M175 216v40 M435 216v40 M695 216v40 M990 216v40" class="line la" marker-end="url(#a)"/><rect class="api" x="160" y="256" width="880" height="126" rx="10"/><text x="190" y="292" class="label">02 / CONTROL PLANE</text><text x="190" y="328" class="txt">cixd</text><text x="300" y="328" class="sub">single-threaded, non-blocking epoll reactor · C compiled with TCC · PID 1</text><text x="190" y="356" class="sub">The sole runtime authority: lifecycle, network, DNS, PKI, LDAP, packages, storage, and hardware access.</text>
<path d="M600 382v52" class="line lk" marker-end="url(#k)"/><rect class="kernel" x="90" y="434" width="1020" height="106" rx="10"/><text x="120" y="470" class="label" style="fill:#55a9bd">03 / LINUX PRIMITIVES</text><text x="120" y="506" class="txt" style="font-size:17px">Namespaces + cgroups</text><text x="380" y="506" class="sub">OverlayFS</text><text x="540" y="506" class="sub">rtnetlink</text><text x="700" y="506" class="sub">device grants</text><text x="885" y="506" class="sub">disk roles</text><text x="120" y="528" class="sub" style="font-size:14px">clone3 · PID/mount namespaces · cgroup v2 · pidfds · kernel-facing networking · explicit /dev access</text>
<path d="M360 540v56 M840 540v56" class="line lw" marker-end="url(#w)"/><rect class="work" x="90" y="596" width="500" height="126" rx="10"/><text x="120" y="632" class="label" style="fill:#8ecf76">04 / WORKLOADS</text><text x="120" y="668" class="txt" style="font-size:18px">Containers carry the work</text><text x="120" y="696" class="sub" style="font-size:14px">filesystem · network · limits · optional hardware</text><rect class="host" x="610" y="596" width="500" height="126" rx="10"/><text x="640" y="632" class="label" style="fill:#aeb9bd">05 / HOST OS</text><text x="640" y="668" class="txt" style="font-size:18px">Read-only root · A/B slots</text><text x="640" y="696" class="sub" style="font-size:14px">kernel policy: pinned · longterm · stable · mainline</text>
<path d="M340 722v44 M860 722v44" class="line lh" marker-end="url(#h)"/><rect class="card" x="250" y="766" width="700" height="54" rx="8"/><text x="280" y="800" class="sub">Managed services run as containers; host identity and logs remain available to the control path.</text><g transform="translate(60 875)"><line x1="0" x2="35" class="line la"/><text x="45" y="5" class="legend">API / control</text><line x1="180" x2="215" class="line lk"/><text x="225" y="5" class="legend">Linux / resource</text><line x1="390" x2="425" class="line lw"/><text x="435" y="5" class="legend">workload / state</text></g></svg>
