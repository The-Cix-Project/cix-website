<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">Cix system map</title>
<desc id="desc">Four layers show operator surfaces flowing through the cixd API and control plane, into Linux resources, and finally into containers and the read-only A/B host. The control plane is written in C and compiled with TCC.</desc>
<style>
.bg{fill:#0a0d0f}.surface{fill:#11181b;stroke:#45535a}.control{fill:#2a1d16;stroke:#d76b35}.linux{fill:#10242a;stroke:#55a9bd}.work{fill:#15251f;stroke:#8ecf76}.host{fill:#171d20;stroke:#aeb9bd}.surface,.control,.linux,.work,.host{stroke-width:2}.cardtext{fill:#f2f0e9;font:600 20px system-ui,sans-serif;stroke:none}.small{fill:#b6c0c2;font:400 14px system-ui,sans-serif;stroke:none}.section{fill:#d76b35;font:700 12px system-ui,sans-serif;letter-spacing:2px;stroke:none}.line{fill:none;stroke-width:3}.a{stroke:#d76b35}.b{stroke:#55a9bd}.c{stroke:#8ecf76}.d{stroke:#aeb9bd}.legend{fill:#b6c0c2;font:400 13px system-ui,sans-serif;stroke:none}
</style>
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 10 4 0 8z" fill="#d76b35"/></marker><marker id="b" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 10 4 0 8z" fill="#55a9bd"/></marker><marker id="c" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 10 4 0 8z" fill="#8ecf76"/></marker><marker id="d" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 10 4 0 8z" fill="#aeb9bd"/></marker></defs>
<rect class="bg" width="1200" height="900" rx="12"/>
<text x="60" y="52" class="section">CIX / SYSTEM MAP</text><text x="60" y="80" class="small">One API path from operator intent to Linux resources and managed workloads.</text>
<text x="60" y="124" class="section">01  OPERATOR SURFACES</text>
<rect class="surface" x="60" y="145" width="250" height="70" rx="7"/><text class="cardtext" x="84" y="176">cixctl</text><text class="small" x="84" y="198">CLI</text>
<rect class="surface" x="330" y="145" width="250" height="70" rx="7"/><text class="cardtext" x="354" y="176">Web dashboard</text><text class="small" x="354" y="198">same REST API</text>
<rect class="surface" x="600" y="145" width="250" height="70" rx="7"/><text class="cardtext" x="624" y="176">Physical console</text><text class="small" x="624" y="198">local surface</text>
<rect class="surface" x="870" y="145" width="270" height="70" rx="7"/><text class="cardtext" x="894" y="176">Your tools</text><text class="small" x="894" y="198">OpenAPI integrations</text>
<path class="line a" d="M185 215v44 M455 215v44 M725 215v44 M1005 215v44" marker-end="url(#a)"/>
<rect class="control" x="120" y="259" width="960" height="112" rx="9"/><text x="150" y="291" class="section">02  API + CONTROL PLANE</text><text x="150" y="328" class="cardtext">cixd</text><text x="255" y="328" class="small">C · TCC · epoll · PID 1</text><text x="150" y="351" class="small">One authority for lifecycle, networking, storage, hardware, packages, DNS, PKI, and LDAP.</text>
<path class="line b" d="M600 371v54" marker-end="url(#b)"/>
<text x="60" y="460" class="section" style="fill:#55a9bd">03  LINUX RESOURCES</text>
<rect class="linux" x="60" y="478" width="1080" height="118" rx="9"/><text x="92" y="516" class="cardtext">Runtime</text><text x="92" y="543" class="small">namespaces · cgroups · pidfds</text><text x="330" y="516" class="cardtext">Filesystem</text><text x="330" y="543" class="small">OverlayFS · immutable lowerdir</text><text x="620" y="516" class="cardtext">Network</text><text x="620" y="543" class="small">rtnetlink · bridges · routes</text><text x="880" y="516" class="cardtext">Hardware</text><text x="880" y="543" class="small">device grants · disks</text><text x="92" y="574" class="small">Direct kernel-facing mechanisms; no hidden privileged client path.</text>
<path class="line c" d="M355 596v58 M845 596v58" marker-end="url(#c)"/>
<text x="60" y="692" class="section" style="fill:#8ecf76">04  WHAT RUNS</text>
<rect class="work" x="60" y="710" width="510" height="108" rx="9"/><text x="92" y="747" class="cardtext">Containers</text><text x="92" y="775" class="small">isolated work · network · limits · health</text><rect class="host" x="630" y="710" width="510" height="108" rx="9"/><text x="662" y="747" class="cardtext">Read-only A/B host</text><text x="662" y="775" class="small">kernel policy · verify · rollback</text>
<path class="line d" d="M315 818v18 M885 818v18" marker-end="url(#d)"/><text x="60" y="850" class="legend">Copper: API/control</text><text x="285" y="850" class="legend">Blue: Linux/resource</text><text x="515" y="850" class="legend">Green: workload/state</text><text x="770" y="850" class="legend">Grey: host/update</text>
</svg>
